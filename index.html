    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

      /* Scanning Animation */
      @keyframes scan-line {
        0% { top: 0%; opacity: 0; }
        5% { opacity: 1; }
        95% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      .animate-scan {
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(to right, transparent, rgba(59, 130, 246, 0.8), transparent);
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        animation: scan-line 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        z-index: 20;
        pointer-events: none;
      }
      .scan-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(59, 130, 246, 0.05), transparent 20%);
        animation: scan-line 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        z-index: 19;
        pointer-events: none;
        border-bottom: 1px solid rgba(59, 130, 246, 0.3);
      }
    </style>
